services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/InvenTU.Api/Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ASPNETCORE_URLS: http://+:${PORT}
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_BASE_URL: http://localhost:${PORT}/api/v1
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      PUBLIC_HUB_URL: ${PUBLIC_HUB_URL}
      PUBLIC_ALERTS_HUB_URL: ${PUBLIC_ALERTS_HUB_URL}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
    depends_on:
      - api

volumes:
  postgres_data:
