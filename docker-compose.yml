services:
  db:
    image: postgres:16-alpine3.23@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db

  api:
    build:
      context: .
      dockerfile: backend/InvenTU.Api/Dockerfile
    restart: always
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ASPNETCORE_URLS: http://+:${PORT:-8080}
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db
      - internal
    # No exposed ports — traffic arrives only through nginx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args: # ✅ indented under build, not under the service
        PUBLIC_API_BASE_URL: /api/v1
        PUBLIC_HUB_URL: /hubs/stock
        PUBLIC_ALERTS_HUB_URL: /hubs/alerts
    restart: always
    environment:
      INTERNAL_API_BASE_URL: http://api:${PORT:-4000}/api/v1
      HOST: 0.0.0.0
      PORT: 4321
    depends_on:
      - api
    networks:
      - internal

  nginx:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: always
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    networks:
      - internal

networks:
  db:
    driver: bridge
  internal:
    driver: bridge

volumes:
  postgres_data:
