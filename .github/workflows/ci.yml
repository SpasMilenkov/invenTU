name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest

    env:
      JwtSettings__Secret: "ci-only-secret-key-minimum-32-chars-long!!"
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test InvenTU.Tests/InvenTU.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx

  frontend-e2e:
    name: frontend e2e (chromium)
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
      PORT: 4000

      # Must match .NET configuration binding
      JwtSettings__Secret: "ci-only-secret-key-minimum-32-chars-long!!"

      PUBLIC_HUB_URL: http://localhost:4000/hubs/live-feed
      PUBLIC_ALERTS_HUB_URL: http://localhost:4000/hubs/alerts
      INTERNAL_API_BASE_URL: http://api:4000/api/v1

      E2E_BASE_URL: http://localhost:4321
      E2E_API_HEALTH_URL: http://localhost:4000/api/v1/health
      E2E_HEALTH_TIMEOUT_SECS: 180

    steps:
      - uses: actions/checkout@v4

      - name: Detect if frontend E2E tests exist
        id: detect
        run: |
          if [ -f frontend/playwright.config.ts ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend E2E tests detected; running."
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend E2E tests found; skipping."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.has_tests == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.7
          run_install: false

      - name: Setup Node
        if: steps.detect.outputs.has_tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.detect.outputs.has_tests == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        if: steps.detect.outputs.has_tests == 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Debug Playwright discovery
        if: steps.detect.outputs.has_tests == 'true'
        working-directory: frontend
        run: |
          echo "==> Current dir: $(pwd)"
          echo "==> Listing tests:"
          find tests/e2e -type f | sort || true
          echo "==> Playwright discovered tests:"
          pnpm exec playwright test --list || true

      - name: Run Playwright
        if: steps.detect.outputs.has_tests == 'true'
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright HTML report
        if: always() && steps.detect.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always() && steps.detect.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-artifacts
          path: frontend/test-results/
          if-no-files-found: ignore
